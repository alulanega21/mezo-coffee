<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">ሜዞ ኮፊ (Mezo Coffee)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                        url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1500&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; padding-bottom: 120px; min-height: 100vh;
        }
        header { text-align: center; padding: 25px 15px 15px 15px; position: relative; }
        .cafe-logo { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 2px solid #f7d794; margin-bottom: 8px; box-shadow: 0 3px 10px rgba(0,0,0,0.5); }
        header h1 { font-size: 2.2em; margin-bottom: 5px; color: #f7d794; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        header p { font-size: 0.9em; color: #f1f1f1; }
        
        /* Category Navigation Tabs */
        .cat-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px 15px;
            background: rgba(0,0,0,0.6);
            position: sticky;
            top: 0;
            z-index: 900;
            overflow-x: auto;
            border-bottom: 1px solid #444;
        }
        .cat-tab {
            background: #333;
            color: #ddd;
            border: 1px solid #555;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            white-space: nowrap;
            transition: 0.2s;
        }
        .cat-tab.active {
            background: #8B4513;
            color: #fff;
            border-color: #f7d794;
            font-weight: bold;
        }

        .container { max-width: 600px; margin: 15px auto; padding: 0 15px; }
        .section-title { color: #f7d794; font-size: 1.2em; margin: 20px 0 10px 0; border-bottom: 1px dashed #f7d794; padding-bottom: 5px; }
        
        .menu-item {
            display: flex; align-items: center; background: rgba(255, 255, 255, 0.95);
            padding: 12px; margin-bottom: 12px; border-radius: 12px; color: #2c2c2c;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); gap: 12px;
        }
        .item-img { width: 75px; height: 75px; object-fit: cover; border-radius: 8px; border: 2px solid #8B4513; }
        .item-details { flex-grow: 1; }
        .item-details h3 { font-size: 1em; color: #2c2c2c; }
        .item-price { font-size: 0.95em; font-weight: bold; color: #8B4513; margin-top: 4px; }
        .counter-box { display: flex; align-items: center; background: #f0ebd8; border-radius: 6px; overflow: hidden; border: 1px solid #d4c5b9; }
        .counter-btn { background: #8B4513; color: white; border: none; width: 28px; height: 28px; font-size: 1.1em; cursor: pointer; }
        .item-count { width: 28px; text-align: center; font-weight: bold; color: #333; }
        
        .payment-section { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .payment-box { background: rgba(255, 255, 255, 0.95); padding: 15px 20px; border-radius: 12px; color: #2c2c2c; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .payment-box h3 { font-size: 1.1em; color: #8B4513; margin-bottom: 10px; }
        .payment-label { display: flex; align-items: center; gap: 10px; font-size: 0.95em; font-weight: 600; color: #333; background: #f9f6f0; padding: 10px 14px; border-radius: 8px; border: 1px solid #d4c5b9; cursor: pointer; margin-top: 8px; }
        .pay-link { color: #0066cc; text-decoration: underline; }
        
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(44, 30, 22, 0.95); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #f7d794; z-index: 1000; }
        .cart-total { color: #f7d794; font-weight: bold; font-size: 1.1em; }
        .order-btn { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 1em; font-weight: bold; cursor: pointer; }

        /* Floating Admin Button */
        .admin-trigger-btn {
            position: fixed; bottom: 25px; left: 20px; background: #8B4513; color: #fff;
            border: 2px solid #f7d794; padding: 10px 16px; border-radius: 30px; cursor: pointer;
            font-size: 0.95em; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.6); z-index: 9999;
            display: flex; align-items: center; gap: 6px;
        }

        /* Modal / Admin Dashboard */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center;
            z-index: 20000; padding: 15px; overflow-y: auto;
        }
        .modal-card {
            background: #222; border: 2px solid #f7d794; padding: 25px; border-radius: 14px;
            width: 100%; max-width: 550px; color: #fff; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-card input, .modal-card select, .modal-card button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #555; background: #333; color: #fff; font-size: 1em; }
        .modal-card select { cursor: pointer; }
        .modal-card button { background: #8B4513; font-weight: bold; cursor: pointer; border: none; }
        .admin-item-row { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 10px; margin-top: 8px; border-radius: 8px; }
        .btn-danger { background: #e74c3c !important; width: auto !important; padding: 6px 12px !important; }
        .btn-edit { background: #f39c12 !important; width: auto !important; padding: 6px 12px !important; margin-right: 5px; }
        .hidden { display: none !important; }
        .loading { text-align: center; padding: 30px; color: #f7d794; font-size: 1.1em; }
    </style>
</head>
<body>

    <!-- Header & Branding -->
    <header>
        <img id="header-logo" src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=200&q=80" alt="Logo" class="cafe-logo">
        <h1 id="header-name">ሜዞ ኮፊ (Mezo Coffee)</h1>
        <p id="header-desc">የሚፈልጉትን ምግብ እና መጠጥ ይምረጡ፣ ክፍያውን ፈጽመው ትዕዛዝ ይላኩ</p>
    </header>

    <!-- Time Catalogs Filter Tabs -->
    <div class="cat-tabs">
        <div class="cat-tab active" onclick="filterCategory('all', this)">ሁሉም (All)</div>
        <div class="cat-tab" onclick="filterCategory('kurs', this)">☕ ቁርስ (Kurs)</div>
        <div class="cat-tab" onclick="filterCategory('misa', this)">🍛 ምሳ (Misa)</div>
        <div class="cat-tab" onclick="filterCategory('erat', this)">🌙 እራት (Erat)</div>
        <div class="cat-tab" onclick="filterCategory('drink', this)">🥤 መጠጦች (Drinks)</div>
    </div>

    <!-- Menu Display Container -->
    <div class="container" id="menu-container">
        <div class="loading">ሜኑውን በመጫን ላይ...</div>
    </div>

    <!-- Payment Section -->
    <div class="payment-section">
        <div class="payment-box">
            <h3>💳 የክፍያ አማራጭ:</h3>
            <label class="payment-label">
                <input type="radio" name="payment" value="ንግድ ባንክ (CBE: 1000085575337)" checked> 
                <div>ንግድ ባንክ (CBE) <br><small>አካውንት: <a href="tel:*847*1000085575337#" class="pay-link">1000085575337</a></small></div>
            </label>
            <label class="payment-label">
                <input type="radio" name="payment" value="ቴሌብር (Telebirr: 0988227317)"> 
                <div>ቴሌብር (Telebirr) <br><small>ስልክ: <a href="tel:*127*2*0988227317#" class="pay-link">0988227317</a></small></div>
            </label>
            <label class="payment-label">
                <input type="radio" name="payment" value="በቦታው ጥሬ ገንዘብ (Cash)"> 
                <div>በቦታው ጥሬ ገንዘብ (Cash)</div>
            </label>
        </div>
    </div>

    <!-- Floating Admin Trigger -->
    <button class="admin-trigger-btn" onclick="openAdminModal()">⚙️ አድሚን መግቢያ</button>

    <!-- Cart Bar -->
    <div class="cart-bar">
        <div>አጠቃላይ: <span class="cart-total" id="total-price">0 ብር</span></div>
        <button class="order-btn" onclick="sendOrder()">ትዕዛዝ ላክ 🚀</button>
    </div>

    <!-- Admin Modal Panel -->
    <div id="admin-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="color: #f7d794;">⚙️ የአድሚን ፓነል</h2>
                <button onclick="closeAdminModal()" style="width: auto; padding: 6px 12px; background: #555;">✕ ዝጋ</button>
            </div>

            <!-- Password Login Screen -->
            <div id="login-box">
                <p style="margin-bottom: 10px; font-size: 0.9em; color: #ccc;">እባክዎ የማስተዳደሪያ የይለፍ ቃል ያስገቡ፡</p>
                <input type="password" id="admin-pass" placeholder="የይለፍ ቃል (mezo123)...">
                <button onclick="checkPassword()">ግባ (Login)</button>
            </div>

            <!-- Dashboard Content -->
            <div id="dashboard-box" class="hidden">
                
                <!-- Branding Editor -->
                <div style="background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #444;">
                    <h3 style="color: #f7d794; margin-bottom: 10px; font-size: 1.1em;">🎨 የካፌ ስም እና ሎጎ ማስተካከያ</h3>
                    <input type="text" id="setting-cafe-name" placeholder="የካፌ ስም">
                    <input type="text" id="setting-cafe-logo" placeholder="የሎጎ ምስል ሊንክ (URL)">
                    <button onclick="saveBranding()" style="background: #27ae60;">ብራንዲንግ አስቀምጥ</button>
                </div>

                <hr style="border-color: #444; margin: 15px 0;">

                <!-- Add/Edit Item Form -->
                <h3 id="admin-form-title" style="color: #f7d794; margin-bottom: 10px; font-size: 1.1em;">አዲስ ምግብ/መጠጥ ጨምር</h3>
                <input type="hidden" id="item-id">
                <input type="text" id="item-name" placeholder="የምግብ/መጠጥ ስም">
                <input type="number" id="item-price" placeholder="ዋጋ በብር">
                
                <!-- Category Selector -->
                <select id="item-category">
                    <option value="kurs">☕ ቁርስ (Kurs)</option>
                    <option value="misa">🍛 ምሳ (Misa)</option>
                    <option value="erat">🌙 እራት (Erat)</option>
                    <option value="drink">🥤 መጠጦች (Drinks)</option>
                </select>

                <input type="text" id="item-desc" placeholder="መግለጫ (Description)">
                <input type="text" id="item-img" placeholder="የምስል ሊንክ (Image URL)">
                <button id="save-btn" onclick="saveItem()">መዝግብ (Save Item)</button>
                <button id="cancel-btn" onclick="resetForm()" class="hidden" style="background: #7f8c8d;">ሰርዝ</button>

                <h3 style="margin: 25px 0 10px 0; border-top: 1px solid #444; padding-top: 15px; font-size: 1.1em;">የምግቦች ዝርዝር አስተዳደር</h3>
                <div id="admin-menu-list"></div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwz3rHazk52QWlFNfB99aER7e1xFtM0O3XXcjBFBCsy3lYv2X3MIGrTw5lJtlxfDG14Mw/exec';
        let menuItems = [];
        let cart = {};
        let currentFilter = 'all';
        const ADMIN_PASS = "mezo123";

        window.onload = function() {
            loadBranding();
            fetchMenu();
            if (window.location.hash === '#admin') {
                openAdminModal();
            }
        };

        function loadBranding() {
            let savedName = localStorage.getItem('mezo_cafe_name');
            let savedLogo = localStorage.getItem('mezo_cafe_logo');
            if (savedName) {
                document.getElementById('header-name').innerText = savedName;
                document.getElementById('page-title').innerText = savedName;
            }
            if (savedLogo) {
                document.getElementById('header-logo').src = savedLogo;
            }
        }

        function saveBranding() {
            let name = document.getElementById('setting-cafe-name').value;
            let logo = document.getElementById('setting-cafe-logo').value;
            if (name) localStorage.setItem('mezo_cafe_name', name);
            if (logo) localStorage.setItem('mezo_cafe_logo', logo);
            alert("ብራንዲንግ ተስተካክሏል!");
            loadBranding();
        }

        async function fetchMenu() {
            try {
                let response = await fetch(scriptURL);
                menuItems = await response.json();
                renderMenu();
            } catch (error) {
                document.getElementById('menu-container').innerHTML = '<div class="loading" style="color: #ff6b6b;">ሜኑውን መጫን አልተቻለም። Google Sheet ወይም Script URL ይፈትሹ።</div>';
            }
        }

        function filterCategory(cat, element) {
            currentFilter = cat;
            document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            renderMenu();
        }

        function renderMenu() {
            let container = document.getElementById('menu-container');
            container.innerHTML = '';

            let categories = {
                'kurs': { title: '☕ ቁርስ (Kurs)', items: [] },
                'misa': { title: '🍛 ምሳ (Misa)', items: [] },
                'erat': { title: '🌙 እራት (Erat)', items: [] },
                'drink': { title: '🥤 መጠጦች (Drinks)', items: [] }
            };

            cart = {};
            menuItems.forEach(item => {
                let cat = item.category || 'kurs'; // Default if empty
                if (categories[cat]) {
                    categories[cat].items.push(item);
                }
                cart[item.name] = { price: Number(item.price), count: 0 };
            });

            let hasContent = false;
            for (let key in categories) {
                if (currentFilter !== 'all' && currentFilter !== key) continue;
                let catData = categories[key];
                if (catData.items.length > 0) {
                    hasContent = true;
                    container.innerHTML += `<div class="section-title">${catData.title}</div>`;
                    catData.items.forEach(item => {
                        container.innerHTML += `
                            <div class="menu-item">
                                <img src="${item.image || 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=200&q=80'}" alt="${item.name}" class="item-img">
                                <div class="item-details">
                                    <h3>${item.name}</h3>
                                    <p style="font-size: 0.8em; color: #555;">${item.description || ''}</p>
                                    <div class="item-price">${item.price} ብር</div>
                                </div>
                                <div class="counter-box">
                                    <button class="counter-btn" onclick="changeCount('${item.name}', -1)">-</button>
                                    <span class="item-count" id="count-${item.name}">0</span>
                                    <button class="counter-btn" onclick="changeCount('${item.name}', 1)">+</button>
                                </div>
                            </div>
                        `;
                    });
                }
            }

            if (!hasContent) {
                container.innerHTML = '<div class="loading">ምንም የተመዘገበ ምግብ/መጠጥ የለም። አድሚን በመግባት ይጨምሩ!</div>';
            }
        }

        function changeCount(itemName, delta) {
            if (cart[itemName]) {
                cart[itemName].count += delta;
                if (cart[itemName].count < 0) cart[itemName].count = 0;
                document.getElementById('count-' + itemName).innerText = cart[itemName].count;
                updateTotal();
            }
        }

        function updateTotal() {
            let total = 0;
            for (let item in cart) {
                total += cart[item].count * cart[item].price;
            }
            document.getElementById('total-price').innerText = total + " ብር";
        }

        function sendOrder() {
            let cafeName = localStorage.getItem('mezo_cafe_name') || "ሜዞ ኮፊ";
            let orderText = `☕ *አዲስ ትዕዛዝ ከ ${cafeName}* ☕%0A%0A`;
            let hasItems = false, grandTotal = 0;

            for (let item in cart) {
                if (cart[item].count > 0) {
                    hasItems = true;
                    let itemTotal = cart[item].count * cart[item].price;
                    grandTotal += itemTotal;
                    orderText += `- ${item}: ${cart[item].count} ቁጥር (${itemTotal} ብር)%0A`;
                }
            }

            if (!hasItems) {
                alert("እባክዎ መጀመሪያ ከሜኑ ላይ ይምረጡ!");
                return;
            }

            let payment = document.querySelector('input[name="payment"]:checked').value;
            orderText += `%0A💰 *አጠቃላይ: ${grandTotal} ብር*%0A💳 *ክፍያ: ${payment}*`;
            window.open(`https://wa.me/251988227317?text=${orderText}`, '_blank');
        }

        function openAdminModal() { document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }

        function checkPassword() {
            if (document.getElementById('admin-pass').value === ADMIN_PASS) {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('dashboard-box').classList.remove('hidden');
                document.getElementById('setting-cafe-name').value = localStorage.getItem('mezo_cafe_name') || "ሜዞ ኮፊ (Mezo Coffee)";
                document.getElementById('setting-cafe-logo').value = localStorage.getItem('mezo_cafe_logo') || "";
                loadAdminMenu();
            } else {
                alert("የተሳሳተ የይለፍ ቃል!");
            }
        }

        async function loadAdminMenu() {
            let response = await fetch(scriptURL);
            menuItems = await response.json();
            renderAdminList();
        }

        function renderAdminList() {
            let container = document.getElementById('admin-menu-list');
            container.innerHTML = '';
            menuItems.forEach((item, index) => {
                container.innerHTML += `
                    <div class="admin-item-row">
                        <div><strong>${item.name}</strong> (${item.category || 'kurs'}) - ${item.price} ብር</div>
                        <div>
                            <button class="btn-edit" onclick="editItem(${index})">አስተካክል</button>
                            <button class="btn-danger" onclick="deleteItem(${item.id})">አጥፋ</button>
                        </div>
                    </div>
                `;
            });
        }

        async function saveItem() {
            let id = document.getElementById('item-id').value;
            let name = document.getElementById('item-name').value;
            let price = document.getElementById('item-price').value;
            let category = document.getElementById('item-category').value;
            let description = document.getElementById('item-desc').value;
            let image = document.getElementById('item-img').value;

            if (!name || !price) {
                alert("ስም እና ዋጋ ማስገባት ግዴታ ነው!");
                return;
            }

            let payload = { action: id ? "update" : "add", id, name, price, category, description, image };
            document.getElementById('save-btn').innerText = "በመመዝገብ ላይ...";

            await fetch(scriptURL, { method: "POST", body: JSON.stringify(payload) });
            alert("በተሳካ ሁኔታ ተከናውኗል!");
            resetForm();
            loadAdminMenu();
            fetchMenu();
        }

        function editItem(index) {
            let item = menuItems[index];
            document.getElementById('item-id').value = item.id;
            document.getElementById('item-name').value = item.name;
            document.getElementById('item-price').value = item.price;
            document.getElementById('item-category').value = item.category || 'kurs';
            document.getElementById('item-desc').value = item.description;
            document.getElementById('item-img').value = item.image;
            document.getElementById('admin-form-title').innerText = "ምግብ ማስተካከያ";
            document.getElementById('save-btn').innerText = "ለውጦችን አስቀምጥ";
            document.getElementById('cancel-btn').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('item-id').value = '';
            document.getElementById('item-name').value = '';
            document.getElementById('item-price').value = '';
            document.getElementById('item-desc').value = '';
            document.getElementById('item-img').value = '';
            document.getElementById('admin-form-title').innerText = "አዲስ ምግብ/መጠጥ ጨምር";
            document.getElementById('save-btn').innerText = "መዝግብ (Save Item)";
            document.getElementById('cancel-btn').classList.add('hidden');
        }

        async function deleteItem(id) {
            if (confirm("ይህን ንጥል ማጥፋት ይፈልጋሉ?")) {
                await fetch(scriptURL, { method: "POST", body: JSON.stringify({ action: "delete", id: id }) });
                alert("ተሰርዟል!");
                loadAdminMenu();
                fetchMenu();
            }
        }
